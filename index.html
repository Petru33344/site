 <!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Magazinul meu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #19cee3;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #222;
            font-size: 40px;
        }

        h2 {
            color: #555;
        }

        .produs {
            background-color: rgb(249, 249, 249);
            width: 250px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .produs img {
            width: 100%;
            border-radius: 10px;
        }

        .produs h3 {
            font-size: 22px;
        }

        .pret {
            font-size: 20px;
            font-weight: bold;
            color: #e63946;
        }

        button {
            background-color: #111;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <h1>Magazinul lui Petru 🛍️</h1>

    <h2>Produsele mele</h2>

    <div class="produs">

        <img src="Screenshot 2026-08-21 153858.png" alt="Pantofi Jordan">

        <h3>Pantofi Jordan</h3>

        <p>Pantofi sport confortabili, potriviți pentru baschet.</p>

        <p class="pret">499 lei</p>

        <button>Adaugă în coș</button>

    </div>

</body>

</html>
